<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wuthering Heights 슬롯 머신</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --card-bg: #ffffff;
            --border-color: #dddddd;
            --accent-color: #222222;
            --text-main: #111111;
            --text-dim: #999999;
            --win-color: #2ecc71;
            --lose-color: #e74c3c;
            --gold: #d4af37;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .info-panel {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 15px;
            text-align: center;
            background: rgba(255,255,255,0.6);
            padding: 6px 15px;
            border-radius: 50px;
        }

        /* 게임 카드 (캡처 영역) */
        .capture-area {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 40px;
            text-align: center;
            width: 360px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }

        .reels-container {
            display: flex;
            gap: 12px;
            margin: 10px 0 25px 0;
            justify-content: center;
        }

        .reel {
            width: 90px;
            height: 120px;
            background: #ffffff;
            border: 2px solid #eeeeee;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            font-weight: 600;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.03);
        }

        .spinning { animation: reel-spin 0.1s infinite linear; }
        @keyframes reel-spin {
            0% { transform: translateY(-2px); filter: blur(2px); }
            100% { transform: translateY(2px); filter: blur(4px); }
        }

        .result-box { margin-top: 10px; min-height: 70px; }
        .multiplier { font-size: 0.95rem; font-weight: 500; margin-bottom: 5px; }
        .final-g { font-size: 1.7rem; font-weight: 800; letter-spacing: -1px; }

        .bet-control {
            width: 360px;
            background: #fff;
            margin-top: 20px;
            padding: 24px;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        .bet-label { font-size: 0.85rem; color: var(--text-dim); font-weight: 600; text-align: left; }
        
        input[type="number"] {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #f0f0f0;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus { border-color: var(--accent-color); }

        /* 하단 버튼 */
        .controls { width: 360px; margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }

        button {
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        #spin-btn { background: var(--accent-color); color: #fff; font-size: 1.1rem; }
        #spin-btn:disabled { background: #ccc; cursor: not-allowed; }
        #copy-btn { background: transparent; color: var(--text-dim); font-size: 0.8rem; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="info-panel">
        777(x10) | 기호일치(x5) | 폭탄(x-3)
    </div>

    <div id="game-card" class="capture-area">
        <div class="reels-container">
            <div class="reel" id="r1">7</div>
            <div class="reel" id="r2">7</div>
            <div class="reel" id="r3">7</div>
        </div>
        
        <div class="result-box">
            <div id="res-mult" class="multiplier">베팅액 입력 후 돌리세요</div>
            <div id="res-total" class="final-g">-</div>
        </div>
    </div>

    <div class="bet-control">
        <div class="bet-label">베팅 G</div>
        <input type="number" id="bet-input" placeholder="금액 입력" min="1">
    </div>

    <div class="controls">
        <button id="spin-btn">슬롯 돌리기</button>
        <button id="copy-btn">결과 화면 복사하기</button>
    </div>

    <script>
        const symbols = ["7", "♥", "♣", "♠", "💣"];
        const btnSpin = document.getElementById('spin-btn');
        const btnCopy = document.getElementById('copy-btn');
        const betInput = document.getElementById('bet-input');
        const multText = document.getElementById('res-mult');
        const totalText = document.getElementById('res-total');
        const reelEls = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];

        async function startSpin() {
            const betAmount = parseInt(betInput.value);

            if (isNaN(betAmount) || betAmount <= 0) {
                alert("베팅 금액을 입력해주세요.");
                return;
            }

            btnSpin.disabled = true;
            betInput.disabled = true;
            
            multText.innerText = "회전 중...";
            multText.style.color = "#999";
            totalText.innerText = "-";

            reelEls.forEach(el => el.classList.add('spinning'));

            const rand = Math.random() * 100;
            let finalResult = [];

            // 확률 로직: 폭탄 10%, 잭팟 5%, 일반 15%, 낙첨 70%
            if (rand < 5) {
                finalResult = ["7", "7", "7"];
            } else if (rand < 15) {
                finalResult = ["💣", "💣", "💣"];
            } else if (rand < 30) {
                const s = symbols[Math.floor(Math.random() * 3) + 1]; 
                finalResult = [s, s, s];
            } else {
                while(true) {
                    finalResult = [
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)]
                    ];
                    if (!(finalResult[0] === finalResult[1] && finalResult[1] === finalResult[2])) break;
                }
            }

            for (let i = 0; i < reelEls.length; i++) {
                await new Promise(r => setTimeout(r, 600 + (i * 400)));
                reelEls[i].classList.remove('spinning');
                reelEls[i].innerText = finalResult[i];
            }

            calculateScore(finalResult, betAmount);
            btnSpin.disabled = false;
            betInput.disabled = false;
        }

        function calculateScore(res, betAmount) {
            const isJackpot = res.every(v => v === "7");
            const isBomb = res.every(v => v === "💣");
            const isMatch = res[0] === res[1] && res[1] === res[2];

            let multiplier = 0;
            let message = "결과: 0배";

            if (isJackpot) {
                multiplier = 10;
                message = "결과: 10배";
                multText.style.color = "var(--gold)";
            } else if (isBomb) {
                multiplier = -3;
                message = "결과: -3배 (폭탄!)";
                multText.style.color = "var(--lose-color)";
            } else if (isMatch) {
                multiplier = 5;
                message = "결과: 5배";
                multText.style.color = "var(--win-color)";
            } else {
                multText.style.color = "#bbb";
            }

            // 초기 금액 없이 베팅액 기준으로만 결과 산출
            const finalResultG = betAmount * multiplier;
            
            multText.innerText = message;
            totalText.innerText = `(최종) ${finalResultG.toLocaleString()} G`;
        }

        async function copyToClipboard() {
            const area = document.getElementById('game-card');
            try {
                const canvas = await html2canvas(area, { backgroundColor: '#f0f0f0', scale: 2 });
                canvas.toBlob(async (blob) => {
                    const item = new ClipboardItem({ "image/png": blob });
                    await navigator.clipboard.write([item]);
                    const prevText = btnCopy.innerText;
                    btnCopy.innerText = "복사 완료!";
                    setTimeout(() => btnCopy.innerText = prevText, 2000);
                });
            } catch (err) {
                alert("복사 실패");
            }
        }

        btnSpin.addEventListener('click', startSpin);
        btnCopy.addEventListener('click', copyToClipboard);
    </script>
</body>
</html>
